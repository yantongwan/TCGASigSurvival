name: R-CMD-check
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Build source package
        run: R CMD build .
        shell: bash
      - name: Check built source package
        shell: Rscript {0}
        run: |
          tarball <- list.files(pattern = "^TCGASigSurvival_.*[.]tar[.]gz$")
          stopifnot(length(tarball) == 1L)
          rcmdcheck::rcmdcheck(tarball, args = "--no-manual", error_on = "warning", check_dir = "check")
      - name: Run executable README tutorial
        shell: Rscript {0}
        run: |
          tarball <- list.files(pattern = "^TCGASigSurvival_.*[.]tar[.]gz$")
          stopifnot(length(tarball) == 1L)
          install.packages(tarball, repos = NULL, type = "source")
          source("scripts/validate_readme.R")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TCGASigSurvival-${{ matrix.os }}
          path: |
            TCGASigSurvival_*.tar.gz
            check/**/00check.log
            check/**/00install.out
